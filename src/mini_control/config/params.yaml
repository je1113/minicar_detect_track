mission_manager:
  ros__parameters:

    # =====================================================
    # Topic
    # =====================================================

    # 고정 웹캠에서 계산한 자동차 map 위치
    target_position_topic: "/target/map_position"

    # AMR OAK-D 자동차 감지
    amr_detection_topic: "/amr/detections"

    # approach 노드 인터페이스
    approach_target_topic: "/approach/target_point"
    approach_cancel_topic: "/approach/cancel"
    approach_status_topic: "/approach/status"

    # TurtleBot4 속도 명령
    cmd_vel_topic: "/robot2/cmd_vel"

    # 좌표계
    map_frame: "map"

    # =====================================================
    # Following
    # =====================================================

    # AMR 카메라 영상 가로 크기
    image_width: 640

    # 추종할 때 자동차와 유지할 목표 거리 [m]
    target_distance: 0.8

    # 이 거리보다 가까우면 전진하지 않음 [m]
    min_distance: 0.5

    # 거리 오차 → 직진 속도 gain
    linear_gain: 0.5

    # 이미지 중심 오차 → 회전 속도 gain
    angular_gain: 1.0

    # 최대 속도
    max_linear_speed: 0.31
    max_angular_speed: 1.0

    # 자동차 중심이 화면 가운데 이 비율 안에 있으면 회전하지 않는다 (0.333 = 가운데 1/3)
    center_deadband_ratio: 0.333

    # 마지막 자동차 감지를 유효하게 보는 시간 [s]
    detection_timeout: 0.5

    # 이 시간 동안 자동차를 한 번도 못 보면 LOST [s]
    # (detection_timeout 이후 lost_timeout 전까지는 멈춰서 기다린다)
    lost_timeout: 2.0

    # LOST 상태에서 자동차를 다시 찾을 때 제자리 회전 속도 [rad/s]
    # 마지막으로 본 쪽으로 돈다. 본 적이 없으면 부호대로 돈다.
    # 양수: 반시계(좌회전), 음수: 시계(우회전)
    lost_angular_speed: 0.03

    # approach 도착(yaw 정렬 완료) 후 정지한 채 자동차를 감지하며 기다리는 시간 [s]
    # 이 시간이 지난 뒤 자동차가 보이면 추종, 계속 안 보이면 LOST
    arrival_hold_time: 2.0

    # =====================================================
    # Battery / Docking
    # =====================================================

    battery_topic: "/robot2/battery_state"
    dock_status_topic: "/robot2/dock_status"

    # 배터리 잔량(0~1)이 이 값 미만이면 미션을 멈추고 도킹하러 간다
    battery_low_threshold: 0.2

    nav_action: "/robot2/navigate_to_pose"
    dock_action: "/robot2/dock"

    # 도크 앞 대기 자세 (map) [m, m, rad]
    # 도크 정면 약 0.5~1m, 도크를 바라보는 방향으로 맞춘다
    dock_staging_x: 0.0
    dock_staging_y: 0.0
    dock_staging_yaw: 0.0

    # Dock 액션 실패 시 도크 앞 이동부터 다시 시도하는 횟수
    dock_max_retries: 2


approach:
  ros__parameters:

    # =====================================================
    # Nav2
    # =====================================================

    nav_action: "/robot2/navigate_to_pose"
    pose_topic: "/robot2/amcl_pose"

    # mission_manager 인터페이스
    target_topic: "/approach/target_point"
    cancel_topic: "/approach/cancel"
    status_topic: "/approach/status"

    map_frame: "map"

    # =====================================================
    # 자동차를 보기 좋은 AMR 위치
    # =====================================================

    # car 위치 기준 AMR goal offset [m]
    #
    # 테스트:
    # car ≈ (-0.0355, 1.025)
    # AMR  ≈ (0.64, 1.84)
    #
    view_offset_x: 0.6755
    view_offset_y: 0.8150
    # =====================================================
    # Nav2 실패 시 cmd_vel fallback
    #
    # Nav2 가 실패하면 아래 경로점을 거쳐 goal 까지 이동한다.
    # 경로점 모서리를 원호로 둥글게 보간하고 pure pursuit 로 곡선 주행하며,
    # 속도는 가감속 한계 안에서 매 주기 보간한다.
    #   (0,0) → (2,0) 좌회전 → (1.79,1.77) 좌회전 → goal
    # =====================================================

    fallback_enabled: true

    cmd_vel_topic: "/robot2/cmd_vel"
    odom_topic: "/robot2/odom"

    # 경로 시작점 + goal 전에 거칠 경로점 [x0, y0, x1, y1, ...] (map) [m]
    # 로봇에서 가장 가까운 구간의 끝점부터 이어서 간다.
    fallback_waypoints: [0.0, 0.0, 2.0, 0.0, 1.79, 1.77]

    fallback_corner_radius: 0.3       # 모서리 원호 반지름 [m] (0 이면 꺾은선)
    fallback_lookahead: 0.25          # pure pursuit 전방 주시 거리 [m]
    fallback_linear_speed: 0.15       # [m/s]
    fallback_angular_speed: 0.6       # [rad/s]
    fallback_linear_accel: 0.3        # [m/s^2]
    fallback_angular_accel: 1.5       # [rad/s^2]
    fallback_position_tolerance: 0.03 # goal 도착 판정 [m]
    fallback_yaw_tolerance: 0.05      # 회전 완료 판정 [rad]
    fallback_heading_tolerance: 0.8   # 주행 중 이보다 틀어지면 감속 후 제자리 회전 [rad]
    fallback_odom_timeout: 1.0        # [s]
    fallback_timeout: 90.0            # [s]

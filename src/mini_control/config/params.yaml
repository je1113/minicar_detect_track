mission_manager:
  ros__parameters:
    # 웹캠이 계산한 자동차 지도 위치
    target_position_topic: "/target/map_position"

    # AMR 카메라의 자동차 감지 결과
    amr_detection_topic: "/amr/detections"

    # approach 노드와 맞춘 팀 인터페이스 토픽
    approach_target_topic: "/approach/target_point"
    approach_cancel_topic: "/approach/cancel"
    approach_status_topic: "/approach/status"

    # 이동 목표를 표현할 좌표계
    map_frame: "map"

    # 아래 연결 정보는 실제 로봇에서 확인한 뒤 추가한다.
    #
    # Nav2 이동 액션 이름
    # navigate_action: "/실제_namespace/navigate_to_pose"
    #
    # 로봇에 속도를 보내는 토픽
    # cmd_vel_topic: "/실제_namespace/cmd_vel"
    #
    # 실제 토픽 타입을 확인해 Twist 또는 TwistStamped로 설정한다.
    # cmd_vel_type: "TwistStamped"

    # 아래 제어값은 테스트 후 결정한다.
    # 숫자는 예시로 임의 지정하지 않고 항목만 남겨둔다.
    #
    # 자동차 근처에 접근할 때 유지할 거리 (미터)
    # approach_distance: ...
    #
    # 추종 중 유지할 목표 거리 (미터)
    # follow_distance: ...
    #
    # 최대 전진 속도 (미터/초)
    # max_linear_speed: ...
    #
    # 최대 회전 속도 (라디안/초)
    # max_angular_speed: ...
    #
    # 감지 결과를 유효하다고 보는 최대 시간 (초)
    # detection_timeout: ...
    #
    # 추종으로 전환하기 전에 필요한 연속 감지 횟수
    # handover_detection_count: ...

    # 코드에서는 필수 설정이 없으면 이동을 시작하지 않도록 한다.

approach:
  ros__parameters:
    # 코드 기본값은 namespace 없는 중립 값이고, 여기서 /robot2 기준으로 덮어쓴다.
    nav_action: "/robot2/navigate_to_pose"
    pose_topic: "/robot2/amcl_pose"

    # mission_manager / localizer 와 맞춘 팀 인터페이스 토픽
    target_topic: "/approach/target_point"
    cancel_topic: "/approach/cancel"
    status_topic: "/approach/status"

    map_frame: "map"

    # 자동차 앞에서 멈출 거리 (미터)
    approach_distance: 0.5
    # 이동 중 자동차가 이만큼 이상 움직여야 goal 을 교체 (미터)
    retarget_threshold: 0.3

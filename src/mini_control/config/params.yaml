mission_manager:
  ros__parameters:

    # =====================================================
    # Topic
    # =====================================================

    # 고정 웹캠에서 계산한 자동차 map 위치
    target_position_topic: "/target/map_position"

    # AMR OAK-D 자동차 감지
    amr_detection_topic: "/amr/detections"

    # approach 노드 인터페이스
    approach_target_topic: "/approach/target_point"
    approach_cancel_topic: "/approach/cancel"
    approach_status_topic: "/approach/status"

    # TurtleBot4 속도 명령
    cmd_vel_topic: "/robot2/cmd_vel"

    # 좌표계
    map_frame: "map"

    # =====================================================
    # Following (Nav2 추종)
    #
    # AMR 카메라 bbox 방향 + depth 거리 → 카메라 frame 점 → TF → map 좌표
    # → approach 로 넘겨 Nav2 goal. 경로상 standoff_distance(approach) 이내면
    # 제자리 회전으로 화면 가운데 유지.
    # =====================================================

    # AMR 카메라 영상 가로 크기 (amr_detector 영상 704x704)
    image_width: 704

    # OAK-D RGB 수평 화각 [deg]
    camera_hfov_deg: 69.0

    # 감지 결과 header 에 frame_id 가 없을 때 쓰는 카메라 frame
    camera_frame: "oakd_rgb_camera_optical_frame"
    base_frame: "base_link"
    odom_frame: "odom"

    # 도착 후 제자리 회전: 이미지 중심 오차 → 회전 속도 gain, 최대 회전 속도
    angular_gain: 1.2
    max_angular_speed: 1.0

    # 자동차 중심이 화면 가운데 이 비율 안에 있으면 회전하지 않음 (0.333 = 가운데 1/3)
    center_deadband_ratio: 0.333

    # 마지막 자동차 감지를 유효하게 보는 시간 [s]
    detection_timeout: 0.5

    # 추종 중 이 시간 동안 자동차를 한 번도 못 보면 LOST (360도 탐색) [s]
    # 그 전까지는 진행 중인 Nav2 goal 을 그대로 둔다
    lost_timeout: 3.0

    # LOST 360도 탐색 회전 속도 [rad/s]. 마지막으로 본 쪽으로 돈다.
    # 빠르면 영상이 흔들려 YOLO 가 놓친다
    lost_angular_speed: 0.03

    # 회전량을 못 재는 경우(TF 없음 등) 대비 탐색 최대 시간 [s]
    lost_search_timeout: 25.0

    # 웹캠 좌표가 이 시간보다 오래되면 접근에 쓰지 않음 [s]
    # 한 바퀴 탐색해도 못 찾았을 때 웹캠 좌표가 신선하면 다시 접근, 아니면 SEARCHING
    webcam_target_timeout: 4.0

    # =====================================================
    # Battery / Docking
    # =====================================================

    battery_topic: "/robot2/battery_state"
    dock_status_topic: "/robot2/dock_status"

    # 배터리 잔량(0~1)이 이 값 미만이면 미션을 멈추고 도킹하러 간다
    battery_low_threshold: 0.2

    nav_action: "/robot2/navigate_to_pose"
    dock_action: "/robot2/dock"

    # 도크 앞 대기 자세 (map) [m, m, rad]
    # 도크 정면 약 0.5~1m, 도크를 바라보는 방향으로 맞춘다
    dock_staging_x: 0.0
    dock_staging_y: 0.0
    dock_staging_yaw: 0.0

    # Dock 액션 실패 시 도크 앞 이동부터 다시 시도하는 횟수
    dock_max_retries: 2


approach:
  ros__parameters:

    # =====================================================
    # Nav2
    # =====================================================

    nav_action: "/robot2/navigate_to_pose"

    # mission_manager 인터페이스
    target_topic: "/approach/target_point"
    cancel_topic: "/approach/cancel"
    status_topic: "/approach/status"

    # 로봇 위치: TF map_frame -> base_frame
    map_frame: "map"
    base_frame: "base_link"

    # =====================================================
    # 자동차 위치로 goal → 경로상 standoff 남으면 취소
    # =====================================================

    # Nav2 feedback 의 경로상 남은 거리가 이보다 작으면 goal 취소 후 ARRIVED [m]
    standoff_distance: 1.0

    # goal 재전송 최소 간격 [s]
    goal_period: 0.5

    # 자동차가 진행 중 goal(또는 도착 위치)에서 이만큼 움직여야 goal 재전송 [m]
    goal_move_threshold: 0.2

    # =====================================================
    # Nav2 실패 시 cmd_vel fallback
    #
    # Nav2 가 실패하면 아래 경로점을 거쳐 자동차 standoff 앞까지 이동한다.
    # 경로점 모서리를 원호로 둥글게 보간하고 pure pursuit 로 곡선 주행하며,
    # 속도는 가감속 한계 안에서 매 주기 보간한다.
    #   (0,0) → (2,0) 좌회전 → (1.79,1.77) 좌회전 → 자동차 (standoff 앞에서 정지)
    # =====================================================

    fallback_enabled: true

    cmd_vel_topic: "/robot2/cmd_vel"

    # 경로 시작점 + goal 전에 거칠 경로점 [x0, y0, x1, y1, ...] (map) [m]
    # 로봇에서 가장 가까운 구간의 끝점부터 이어서 간다.
    fallback_waypoints: [0.0, 0.0, 2.0, 0.0, 1.79, 1.77]

    fallback_corner_radius: 0.3       # 모서리 원호 반지름 [m] (0 이면 꺾은선)
    fallback_lookahead: 0.25          # pure pursuit 전방 주시 거리 [m]
    fallback_linear_speed: 0.15       # [m/s]
    fallback_angular_speed: 0.6       # [rad/s]
    fallback_linear_accel: 0.3        # [m/s^2]
    fallback_angular_accel: 1.5       # [rad/s^2]
    fallback_position_tolerance: 0.03 # goal 도착 판정 [m]
    fallback_yaw_tolerance: 0.05      # 회전 완료 판정 [rad]
    fallback_heading_tolerance: 0.8   # 주행 중 이보다 틀어지면 감속 후 제자리 회전 [rad]
    fallback_pose_timeout: 1.0        # TF 로봇 위치를 이 시간 못 구하면 FAILED [s]
    fallback_timeout: 90.0            # [s]
